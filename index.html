<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15分钟生活圈智能体检与规划助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            color: #1890ff;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            color: #666;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .feature {
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
            transition: transform 0.3s;
        }

        .feature:hover {
            transform: translateY(-5px);
        }

        .feature-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .feature h3 {
            font-size: 18px;
            color: #333;
            margin-bottom: 8px;
        }

        .feature p {
            font-size: 14px;
            color: #666;
        }

        .links {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .link {
            display: inline-block;
            padding: 12px 24px;
            background: #1890ff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            transition: background 0.3s;
        }

        .link:hover {
            background: #40a9ff;
        }

        .link.secondary {
            background: #52c41a;
        }

        .link.secondary:hover {
            background: #73d13d;
        }

        .tech-stack {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e8e8e8;
        }

        .tech-stack h3 {
            font-size: 16px;
            color: #666;
            margin-bottom: 15px;
        }

        .tech-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .tech-tag {
            padding: 6px 12px;
            background: #f0f5ff;
            color: #1890ff;
            border-radius: 4px;
            font-size: 14px;
        }

        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e8e8e8;
            color: #999;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .features {
                grid-template-columns: 1fr;
            }

            .links {
                flex-direction: column;
            }

            .link {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏘️ 15分钟生活圈智能体检与规划助手</h1>
            <p>基于百度地图开放能力，分析社区民生设施覆盖情况</p>
        </div>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">🕐</div>
                <h3>等时圈计算</h3>
                <p>计算5/10/15分钟步行可达范围</p>
            </div>
            <div class="feature">
                <div class="feature-icon">📍</div>
                <h3>POI设施分析</h3>
                <p>分析周边医疗、教育、购物等设施</p>
            </div>
            <div class="feature">
                <div class="feature-icon">⚠️</div>
                <h3>盲区识别</h3>
                <p>自动识别服务盲区</p>
            </div>
            <div class="feature">
                <div class="feature-icon">📊</div>
                <h3>体检报告</h3>
                <p>生成可视化分析报告</p>
            </div>
        </div>

        <div class="links">
            <a href="https://gitee.com/wuxiejiameng123/15min-life-circle" class="link">
                📚 查看源码
            </a>
            <a href="https://gitee.com/wuxiejiameng123/15min-life-circle#快速开始" class="link secondary">
                🚀 快速开始
            </a>
        </div>

        <div class="tech-stack">
            <h3>技术栈</h3>
            <div class="tech-tags">
                <span class="tech-tag">React</span>
                <span class="tech-tag">TypeScript</span>
                <span class="tech-tag">FastAPI</span>
                <span class="tech-tag">Python</span>
                <span class="tech-tag">NetworkX</span>
                <span class="tech-tag">百度地图API</span>
                <span class="tech-tag">ECharts</span>
                <span class="tech-tag">Docker</span>
            </div>
        </div>

        <div class="footer">
            <p>15分钟生活圈智能体检与规划助手 © 2025</p>
            <p>基于百度地图开放能力的社区生活圈分析工具</p>
        </div>
    </div>
</body>
</html>
