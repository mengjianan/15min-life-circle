name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8 pytest-asyncio

    - name: Lint with flake8
      run: |
        cd backend
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run unit tests
      run: |
        cd backend
        set -o pipefail
        python -VV
        python -m pytest --version
        pip list | grep -Ei 'pytest|coverage|asyncio' || true
        python -m pytest tests/test_graph.py tests/test_poi.py tests/test_isochrone.py -v --cov=. --cov-report=xml 2>&1 | tee "$GITHUB_WORKSPACE/pytest-output.txt"
      env:
        BAIDU_MAP_AK: ${{ secrets.BAIDU_MAP_AK }}

    - name: Upload test log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-log
        path: pytest-output.txt
        if-no-files-found: ignore

    - name: Upload coverage
      if: always()
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage.xml

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Lint
      run: |
        cd frontend
        npm run lint || true

    - name: Build
      run: |
        cd frontend
        npm run build
      env:
        VITE_API_BASE_URL: /api

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Backend Image
      # 同时打上 compose 默认会用的镜像名（项目名=目录名），避免重复构建
      run: |
        docker build -f Dockerfile.backend -t life-circle-backend:latest -t 15min-life-circle-backend:latest .

    - name: Build Frontend Image
      run: |
        docker build -f Dockerfile.frontend -t life-circle-frontend:latest -t 15min-life-circle-frontend:latest .

    - name: Test Docker Compose
      run: |
        set -x
        # 用 compose v2（v1 的 docker-compose 已从 runner 移除）
        docker compose up -d
        # 后端端口是 8081（compose 映射 8081:8000），轮询等待就绪
        ok=0
        for i in $(seq 1 60); do
          if curl -fsS http://localhost:8081/health; then
            echo " backend health OK (第${i}次)"
            ok=1
            break
          fi
          sleep 3
        done
        if [ "$ok" != "1" ]; then
          echo "::error::后端健康检查失败（http://localhost:8081/health）"
          docker compose ps || true
          docker compose logs --tail=200 || true
          docker compose down || true
          exit 1
        fi
        # 前端也应可访问
        curl -fsS -o /dev/null -w "frontend HTTP %{http_code}\n" http://localhost:3001/
        docker compose down
